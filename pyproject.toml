[project]
name = "finalproject-bezhnar-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub — платформа для отслеживания и симуляции торговли валютами"
requires-python = ">=3.11"
dependencies = [
    "prettytable>=3.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "I", "F", "N", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
